services:
  sentinel-go:
    build: .
    container_name: sentinel-go
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      PORT: "5005"
      AUTHORIZATION: ""
      DEFAULT_MODEL: "gpt-5-5-thinking"
      TEMP_MODE: "false"
      SESSION_TTL_MINUTES: "120"
      TOKEN_REFRESH_AHEAD_SEC: "86400"
      REFRESH_LOOP_SEC: "1800"
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./images:/app/images
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional frontend: docker compose --profile webui up -d
  open-webui:
    profiles: ["webui"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: "http://sentinel-go:5005/v1"
      OPENAI_API_KEY: "sk-any"
      WEBUI_AUTH: "true"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      sentinel-go:
        condition: service_healthy

volumes:
  open-webui-data:
